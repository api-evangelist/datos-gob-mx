aid: datos-gob-mx
name: datos.gob.mx - Sitio oficial de datos abiertos del Gobierno de la República
description: >-
  datos.gob.mx - Sitio oficial de datos abiertos del Gobierno de la República is a open data portal open-data portal for Mexico running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 1,652 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
